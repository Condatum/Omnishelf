<div class="flex items-center justify-between border-b border-shelf-border px-6 py-4">
    <h2 id="modal-heading" class="text-lg font-semibold text-white">Remove Story?</h2>
    <button type="button"
            onclick="this.closest('dialog')?.close()"
            aria-label="Close modal"
            class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-shelf-elevated hover:text-white">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
</div>

<form method="post"
      action="{% url 'library:entry_delete' object.pk %}"
      hx-post="{% url 'library:entry_delete' object.pk %}"
      hx-target="#grand-library-grid-container"
      hx-swap="outerHTML"
      aria-labelledby="modal-heading"
      class="space-y-5 p-6">
    {% csrf_token %}
    <p class="text-sm leading-relaxed text-slate-300">
        Are you sure you want to remove <strong class="text-white">{{ object.custom_title }}</strong> and its
        frozen chapter URI history from your Grand Library? This action cannot be undone.
    </p>

    <div class="flex items-center justify-end gap-3 border-t border-shelf-border pt-4">
        <button type="button"
                autofocus
                onclick="this.closest('dialog')?.close()"
                class="inline-flex min-h-10 items-center rounded-xl border border-shelf-border bg-shelf-elevated px-4 py-2 text-sm font-medium text-slate-200 transition-colors hover:text-white">
            Keep Story
        </button>
        <button type="submit"
                class="inline-flex min-h-10 items-center rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-rose-500">
            Remove Story
        </button>
    </div>
</form>
