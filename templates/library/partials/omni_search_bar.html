<search aria-label="Omni-Search your Grand Library">
    <form id="omni-search-form"
          method="get"
          action="{% url 'library:omni_search' %}"
          hx-get="{% url 'library:omni_search' %}"
          hx-target="#grand-library-grid-container"
          hx-swap="outerHTML"
          hx-push-url="true"
          class="relative flex items-center gap-2">
        {% include "library/partials/omni_search_hidden_filters.html" %}
        <label for="omni-search-input" class="sr-only">
            Omni-Search by custom title, original title, tag, source domain, or context notes
        </label>
        <div class="relative flex-1">
            <span class="pointer-events-none absolute inset-y-0 left-3.5 flex items-center text-slate-400" aria-hidden="true">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
            </span>
            <input type="search"
                   id="omni-search-input"
                   name="q"
                   value="{{ active_query }}"
                   placeholder="Omni-Search by alias, tag, domain (e.g. royalroad, reddit), or notes..."
                   autocomplete="off"
                   autocorrect="off"
                   autocapitalize="none"
                   spellcheck="false"
                   enterkeyhint="search"
                   hx-get="{% url 'library:omni_search' %}"
                   hx-trigger="keyup changed delay:200ms, search"
                   hx-target="#grand-library-grid-container"
                   hx-swap="outerHTML"
                   hx-include="#omni-search-form"
                   hx-indicator="#omni-search-spinner"
                   onkeydown="if (event.key === 'Enter' && (event.isComposing || event.keyCode === 229)) { event.preventDefault(); }"
                   class="min-h-11 w-full rounded-2xl border border-shelf-border bg-shelf-surface py-2.5 pl-10 pr-10 text-sm text-slate-100 placeholder-slate-500 shadow-sm transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/35">
            <span id="omni-search-spinner"
                  class="htmx-indicator pointer-events-none absolute inset-y-0 right-3.5 flex items-center text-indigo-400"
                  aria-hidden="true">
                <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path>
                </svg>
            </span>
        </div>
        <button type="submit"
                class="inline-flex min-h-11 shrink-0 items-center rounded-2xl border border-shelf-border bg-shelf-elevated px-4 py-2 text-xs font-semibold text-slate-200 transition-colors hover:border-indigo-500/50 hover:text-white">
            Search
        </button>
    </form>
</search>
