<div id="omni-search-hidden-filters" {% if oob %}hx-swap-oob="true"{% endif %}>
    {% if active_status %}
        <input type="hidden" name="status" value="{{ active_status }}">
    {% endif %}
    {% if active_folder %}
        <input type="hidden" name="folder" value="{{ active_folder }}">
    {% endif %}
    {% if active_tag %}
        <input type="hidden" name="tag" value="{{ active_tag }}">
    {% endif %}
</div>
