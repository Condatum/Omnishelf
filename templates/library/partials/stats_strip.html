<dl id="library-stats-strip"
    {% if oob %}hx-swap-oob="true"{% endif %}
    class="grid grid-cols-2 gap-3 sm:grid-cols-4"
    aria-label="Library summary statistics">
    <div class="rounded-xl border border-shelf-border bg-shelf-surface px-4 py-2.5">
        <dt class="text-[11px] font-medium uppercase tracking-wider text-slate-400">Total</dt>
        <dd class="mt-0.5 text-lg font-bold text-white">{{ total_count }}</dd>
    </div>
    <div class="rounded-xl border border-shelf-border bg-shelf-surface px-4 py-2.5">
        <dt class="text-[11px] font-medium uppercase tracking-wider text-emerald-400">Active</dt>
        <dd class="mt-0.5 text-lg font-bold text-white">{{ active_count }}</dd>
    </div>
    <div class="rounded-xl border border-shelf-border bg-shelf-surface px-4 py-2.5">
        <dt class="text-[11px] font-medium uppercase tracking-wider text-indigo-400">Binge-Ready</dt>
        <dd class="mt-0.5 text-lg font-bold text-white">{{ binge_ready_count }}</dd>
    </div>
    <div class="rounded-xl border border-shelf-border bg-shelf-surface px-4 py-2.5">
        <dt class="text-[11px] font-medium uppercase tracking-wider text-amber-400">On Hold</dt>
        <dd class="mt-0.5 text-lg font-bold text-white">{{ on_hold_count }}</dd>
    </div>
</dl>
