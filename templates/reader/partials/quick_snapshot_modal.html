<div class="flex items-center justify-between border-b border-shelf-border px-6 py-4">
    <div>
        <h2 id="modal-heading" class="text-lg font-semibold text-white">Freeze Snapshot</h2>
        <p class="mt-0.5 text-xs text-slate-400">{{ entry.custom_title }}</p>
    </div>
    <button type="button"
            onclick="this.closest('dialog')?.close()"
            aria-label="Close modal"
            class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-shelf-elevated hover:text-white">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
</div>

<form method="post"
      action="{% url 'reader:freeze_snapshot' entry.pk %}"
      hx-post="{% url 'reader:freeze_snapshot' entry.pk %}"
      hx-target="#entry-card-{{ entry.pk }}"
      hx-swap="outerHTML"
      aria-labelledby="modal-heading"
      x-data="{
          uri: '{{ entry.current_uri|escapejs }}',
          chapterLabel: '{{ entry.chapter_label|escapejs }}',
          clipboardNotice: '',
          bumpChapter() {
              const cleaned = (this.chapterLabel || '').trim();
              if (!cleaned) { this.chapterLabel = 'Ch. 1'; return; }
              const match = cleaned.match(/(\d+)(?!.*\d)/);
              if (!match) { this.chapterLabel = cleaned + ' 2'; return; }
              const numStr = match[1];
              const nextNum = parseInt(numStr, 10) + 1;
              const formatted = (numStr.startsWith('0') && numStr.length > 1)
                  ? String(nextNum).padStart(numStr.length, '0')
                  : String(nextNum);
              this.chapterLabel = cleaned.slice(0, match.index) + formatted + cleaned.slice(match.index + numStr.length);
          },
          async pasteUri() {
              try {
                  const text = (await navigator.clipboard.readText()).trim();
                  if (text) {
                      this.uri = text;
                      this.clipboardNotice = 'Pasted URI from clipboard';
                  } else {
                      this.clipboardNotice = 'Clipboard is empty';
                  }
              } catch {
                  this.clipboardNotice = 'Clipboard access denied — paste manually (Ctrl/Cmd+V)';
              }
          }
      }"
      class="space-y-4 p-6">
    {% csrf_token %}
    <input type="hidden" name="source" value="card">

    <div>
        <div class="mb-1.5 flex items-center justify-between">
            <label for="quick-snap-uri" class="text-xs font-semibold uppercase tracking-wider text-slate-300">
                Active Chapter URI <span class="text-rose-400" aria-hidden="true">*</span>
            </label>
            <button type="button"
                    @click="pasteUri()"
                    class="rounded-lg border border-shelf-border bg-shelf-elevated px-2.5 py-1 text-[11px] font-semibold text-indigo-300 hover:border-indigo-500/40 hover:text-indigo-200">
                Paste from Clipboard
            </button>
        </div>
        <input type="url"
               id="quick-snap-uri"
               name="uri"
               x-model="uri"
               required
               autofocus
               autocorrect="off"
               autocapitalize="none"
               spellcheck="false"
               class="w-full rounded-xl border border-shelf-border bg-shelf-bg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500">
        <p role="status" class="mt-1 min-h-4 text-xs text-slate-400" x-text="clipboardNotice"></p>
    </div>

    <div>
        <label for="quick-snap-chapter" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-slate-300">
            Chapter Label
        </label>
        <div class="flex items-center gap-2">
            <input type="text"
                   id="quick-snap-chapter"
                   name="chapter_label"
                   x-model="chapterLabel"
                   placeholder="e.g., Ch. 42"
                   class="min-w-0 flex-1 rounded-xl border border-shelf-border bg-shelf-bg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500">
            <button type="button"
                    @click="bumpChapter()"
                    class="inline-flex min-h-10 shrink-0 items-center rounded-xl border border-indigo-500/40 bg-indigo-500/15 px-3.5 py-2 text-xs font-semibold text-indigo-200 transition-colors hover:bg-indigo-500/25">
                +1 Chapter
            </button>
        </div>
    </div>

    <div>
        <label for="quick-snap-notes" class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-slate-300">
            Context Note (Optional)
        </label>
        <input type="text"
               id="quick-snap-notes"
               name="notes"
               value="{{ entry.notes }}"
               placeholder="Where did you stop?"
               class="w-full rounded-xl border border-shelf-border bg-shelf-bg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500">
    </div>

    <div class="flex items-center justify-end gap-3 border-t border-shelf-border pt-4">
        <button type="button"
                onclick="this.closest('dialog')?.close()"
                class="inline-flex min-h-10 items-center rounded-xl border border-shelf-border bg-shelf-elevated px-4 py-2 text-sm font-medium text-slate-300 hover:text-white">
            Cancel
        </button>
        <button type="submit"
                class="inline-flex min-h-10 items-center rounded-xl bg-emerald-600 px-5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500">
            Freeze Snapshot
        </button>
    </div>
</form>
