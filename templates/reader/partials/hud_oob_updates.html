<span id="hud-chapter-badge"
      hx-swap-oob="true"
      class="inline-flex shrink-0 items-center rounded-full bg-indigo-500/20 px-2.5 py-0.5 text-xs font-semibold text-indigo-200 ring-1 ring-inset ring-indigo-400/35">
    {{ entry.chapter_label|default:"Active Chapter" }}
</span>

<span id="hud-domain-badge"
      hx-swap-oob="true"
      class="hidden shrink-0 items-center rounded-lg bg-shelf-bg px-2 py-0.5 text-[11px] font-medium text-slate-400 ring-1 ring-inset ring-shelf-border sm:inline-flex">
    {{ entry.source_domain }}
</span>

<span id="hud-history-count" hx-swap-oob="true">{{ snapshots|length }}</span>

<a id="external-tab-fallback-link"
   hx-swap-oob="true"
   href="{{ entry.current_uri }}"
   target="_blank"
   rel="noopener noreferrer"
   class="inline-flex min-h-9 items-center gap-1.5 rounded-xl bg-indigo-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-sm transition-colors hover:bg-indigo-500">
    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
    </svg>
    <span>External Tab Fallback</span>
</a>

{% include "reader/partials/snapshot_history_list.html" with oob=True %}
